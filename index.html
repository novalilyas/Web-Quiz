<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web-Quiz</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="bgCanvas"></canvas>
    <canvas id="confettiCanvas"></canvas>

    <button
      class="sound-toggle"
      onclick="toggleSound()"
      title="Matikan/Hidupkan Suara"
    >
      🔊
    </button>

    <div class="page active" id="loginPage">
      <div class="glass-card login-box">
        <div class="logo-container">
          <div class="logo-icon"></div>
          <div class="logo-glow"></div>
        </div>
        <h1>Quiz Santai <span class="text-gradient">Chill</span></h1>
        <p class="subtitle">tebak - tebakan yokk</p>

        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="usernameInput"
              placeholder="Username"
              maxlength="15"
              autocomplete="off"
            />
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">📧</span>
            <input
              type="email"
              id="emailInput"
              placeholder="Email Address"
              autocomplete="off"
            />
          </div>
        </div>

        <button class="btn-primary btn-lg" onclick="login()">
          <span class="btn-text">Masuk</span>
          <span class="btn-glow"></span>
        </button>
      </div>
    </div>

    <div class="page" id="dashboardPage">
      <div class="dashboard-container">
        <header class="glass-header">
          <div class="user-profile">
            <div class="avatar-circle" id="userAvatar">A</div>
            <div class="user-meta">
              <h3 id="userName">Player</h3>
              <span class="badge-rank">Pemula</span>
            </div>
          </div>
          <button class="btn-logout" onclick="logout()">
            <span class="icon">🚪</span> Keluar
          </button>
        </header>

        <div class="stats-row">
          <div class="stat-card glass-card">
            <div class="stat-icon">🔥</div>
            <div class="stat-info">
              <span class="stat-value" id="totalQuizzes">0</span>
              <span class="stat-label">Matches</span>
            </div>
          </div>
          <div class="stat-card glass-card">
            <div class="stat-icon">💎</div>
            <div class="stat-info">
              <span class="stat-value" id="avgScore">0%</span>
              <span class="stat-label">Avg Score</span>
            </div>
          </div>
          <div class="stat-card glass-card">
            <div class="stat-icon">👑</div>
            <div class="stat-info">
              <span class="stat-value" id="bestScore">0%</span>
              <span class="stat-label">Best</span>
            </div>
          </div>
        </div>

        <div class="content-grid">
          <div class="main-action">
            <div class="glass-card quiz-banner">
              <div class="quiz-content">
                <span class="tag">QUIZ</span>
                <h2>Web Challenge</h2>
                <p>HTML, CSS, & JavaScript</p>
                <div class="quiz-meta">
                  <span> 10 Soal</span>
                  <span> 30s/soal</span>
                </div>
                <button class="btn-primary" onclick="startQuiz()">
                  Mulai Sekarang
                </button>
              </div>
              <div class="quiz-visual">💻</div>
            </div>
          </div>

          <div class="leaderboard-panel glass-card">
            <h3>🏆 Top Players</h3>
            <div id="leaderboardList" class="leaderboard-list"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="page" id="quizPage">
      <div class="quiz-wrapper">
        <div class="glass-card quiz-card">
          <div class="quiz-top">
            <div class="progress-section">
              <div class="q-counter">
                Question <span id="currentQ">1</span>/<span id="totalQ"
                  >10</span
                >
              </div>
              <div class="timer-badge" id="timerBadge">
                <svg class="timer-ring" width="40" height="40">
                  <circle
                    class="timer-ring-circle"
                    stroke="white"
                    stroke-width="3"
                    fill="transparent"
                    r="16"
                    cx="20"
                    cy="20"
                  />
                </svg>
                <span id="timeLeft">30</span>
              </div>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="progressBar"></div>
            </div>
          </div>

          <div class="question-area">
            <h2 id="question" class="fade-in">Loading...</h2>
          </div>

          <div id="options" class="options-grid"></div>

          <button
            class="btn-primary btn-next"
            id="nextBtn"
            onclick="nextQuestion()"
          >
            Selanjutnya ➔
          </button>
        </div>
      </div>
    </div>

    <div class="page" id="resultsPage">
      <div class="glass-card results-card">
        <div class="result-header">
          <div class="score-ring-container">
            <svg class="score-ring-svg">
              <circle cx="80" cy="80" r="70" class="ring-bg"></circle>
              <circle
                cx="80"
                cy="80"
                r="70"
                class="ring-fill"
                id="scoreRingFill"
              ></circle>
            </svg>
            <div class="score-text">
              <span id="finalScore">0%</span>
            </div>
          </div>
          <h2 id="scoreMessage">Awesome!</h2>
        </div>

        <div class="result-details">
          <div class="detail-item correct">
            <span class="lbl">Benar</span>
            <span class="val" id="correctAnswers">0</span>
          </div>
          <div class="detail-item wrong">
            <span class="lbl">Salah</span>
            <span class="val" id="wrongAnswers">0</span>
          </div>
          <div class="detail-item time">
            <span class="lbl">Waktu</span>
            <span class="val" id="totalTime">0s</span>
          </div>
        </div>

        <div class="action-buttons">
          <button class="btn-secondary" onclick="window.backToDashboard()">
            🏠 Home
          </button>
          <button class="btn-primary" onclick="startQuiz()">🔄 Replay</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
